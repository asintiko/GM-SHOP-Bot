version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gmshop_postgres
    environment:
      POSTGRES_DB: gmshop
      POSTGRES_USER: gmshop_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmshop_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmshop_user -d gmshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmshop_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmshop_bot
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bot:/app/bot
      - ./logs:/app/logs
    restart: unless-stopped
    command: python -m bot.main

volumes:
  postgres_data:
  redis_data:
